name: Random testing

# The app's nightly testing on GitHub's computers (free for public repos),
# 11pm Perth (15:00 UTC). The kernel's own random testing and whole-kernel
# mutation testing moved with the kernel to its private repo and run in
# kernel-nightly.yml, with their results in the private kernel-results repo
# (Ben's decision, 2026-10-27).
#
# A journeys job walks the magic-moment journeys against tests/baseline.json
# (X8b); a golden job rebuilds the golden models (step 28b; a failing model
# files an issue); a monkey job runs two seeded 2,000-action sessions in the
# real app (hunt 3f; a failing seed files an issue too); ts-mutants runs
# TypeScript mutation testing (packages/testing/stryker). A final job adds
# everything to the `test-results` branch (.github/scripts/collect-results.sh:
# summary.txt, failures/<seed>/, journeys/, golden/, monkey/, ts-mutants/)
# and files one issue per kind of problem found (.github/scripts/file_issues.py).
#
# "Run workflow" on the Actions tab (or workflow_dispatch from a thread) runs
# the same on any branch, TypeScript mutation testing only if asked.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: "0 15 * * *"
    # Extra back-to-back runs while Ben's Claude limit resets; the gate job
    # skips them after 2026-10-21 07:00 UTC, so nothing needs undoing.
    - cron: "5 3,9,21 * * *"
  workflow_dispatch:
    inputs:
      ts_mutants:
        description: "Also run TypeScript mutation testing (every night runs it)"
        type: boolean
        default: false

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

# The nightly run has its own group and main's runs by hand theirs, so runs
# started from threads during the day never hold them up. Every branch's run
# shares one group (Ben, 2026-10-26, after merges waited half an hour for
# runners behind several branches' runs at once): one runs at a time, and a
# newer one waits for it (GitHub keeps one waiting run per group: a newer
# dispatch replaces the one already waiting). Nothing is cancelled here;
# stop-testing.yml cancels a branch's runs when its pull request merges or
# closes. (The kernel's random rounds, which gave way to CI, are in
# kernel-nightly.yml now.) Tested in .github/scripts/test_ci_concurrency.py.
concurrency:
  group: random-testing-${{ github.event_name == 'schedule' && 'nightly' || github.ref == 'refs/heads/main' && 'main' || 'branches' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "5 3,9,21 * * *" ] && [ "$(date -u +%s)" -ge "$(date -u -d 2026-10-21T07:00:00Z +%s)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  # The magic-moment journeys (X8b, apps/fission/e2e/journeys.mjs) against
  # their baseline in tests/baseline.json: red on an extra click, a slowest
  # walk more than twice the baseline or, on a branch, more than 30% slower
  # than main's build walked in turns on the same runner (more than 15% over
  # either only flags); the lines go into summary.txt either way.
  journeys:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (chromium)
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh chromium
      # On a branch, main's build too, so the journeys are timed against it on
      # this same runner (a slow runner slows both alike). Best effort: if
      # main doesn't build, the baseline alone judges.
      - name: Build main for comparison
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
          cd "$RUNNER_TEMP/main"
          npm ci
          npm run build -w @fission/app
          echo "JOURNEY_REFERENCE_DIST=$RUNNER_TEMP/main/apps/fission/dist" >> "$GITHUB_ENV"
      - name: Journeys against the baseline
        working-directory: apps/fission
        env:
          JOURNEY_NIGHTLY: "1"
          JOURNEY_REPORT: ${{ runner.temp }}/journeys/report.txt
        run: node --experimental-strip-types --no-warnings e2e/journeys.mjs
      # The long-session soak (apps/fission/e2e/soak.mjs): 60 cycles of sketch,
      # extrude, edit, undo, split view, save, New and open; red when the heap,
      # DOM nodes, listeners, kernel bodies or memory, or the viewport's
      # geometries keep growing. About 16 minutes.
      - name: Long-session soak (memory leaks)
        if: always()
        working-directory: apps/fission
        env:
          SOAK_CYCLES: "60"
          SOAK_EVERY: "5"
          SOAK_REPORT: ${{ runner.temp }}/journeys/soak.json
        run: timeout 40m node e2e/soak.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journeys
          path: ${{ runner.temp }}/journeys/
          if-no-files-found: ignore

  # The monkey's long sessions (hunt 3f, apps/fission/e2e/monkey.mjs): two
  # seeded sessions of 2,000 user actions each in the real app in Chromium,
  # every check after every action; seeds from the night's date (YYYYMMDD0
  # and YYYYMMDD1), so a night replays exactly. A failing session is shrunk
  # to a short action list; monkey_night.py turns the output into report.txt
  # and a failure folder per failing (or unfinished) seed, which files a
  # random-testing issue like a failing round (collect-results.sh,
  # file_issues.py). The sessions are cut off at 300 minutes so the report is
  # always written.
  monkey:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (chromium)
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh chromium
      - name: Two seeded sessions of 2,000 actions
        working-directory: apps/fission
        env:
          OUT: ${{ runner.temp }}/monkey
        run: |
          mkdir -p "$OUT"
          first="$(date -u +%Y%m%d)0"
          MONKEY_NO_REGRESSIONS=1 MONKEY_SEEDS="$first-$((first + 1))" MONKEY_STEPS=2000 \
            timeout 300m node e2e/monkey.mjs 2>&1 | tee "$OUT/monkey.log" | grep -E '^(seed |monkey:)' || true
          python3 ../../.github/scripts/monkey_night.py "$OUT/monkey.log" e2e/monkey-results "$OUT" "$first" 2 2000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: monkey
          path: ${{ runner.temp }}/monkey/
          if-no-files-found: ignore

  # The golden models (step 28b, packages/testing/golden/nightly.ts): every
  # model in tests/golden that builds today rebuilt in 50 shuffled rounds on
  # one kernel, each checked against its hand-worked answers and against its
  # own first rebuild, then timed and counted against tests/baseline.json
  # (baseline.py --only app.golden). Red on any wrong or changing answer, a
  # leaked body or a metric past its margin; a failing model's folder files
  # a random-testing issue (collect-results.sh, file_issues.py) and the
  # lines go into summary.txt either way.
  golden:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Golden models against their answers and tests/baseline.json
        env:
          OUT: ${{ runner.temp }}/golden
          FISSION_GOLDEN_ROUNDS: "50"
        run: |
          mkdir -p "$OUT"
          code=0
          FISSION_SEED=$(date -u +%s) FISSION_GOLDEN_OUT="$OUT" npm run golden -w @fission/testing || code=$?
          if [ -f "$OUT/measured.json" ]; then
            python3 .github/scripts/baseline.py --measured "$OUT/measured.json" --only app.golden >"$OUT/baseline.txt" || code=$?
            cat "$OUT/baseline.txt"
            grep -E '^(\|[^-]|[0-9]+ metric)' "$OUT/baseline.txt" >>"$OUT/report.txt" || true
          fi
          exit $code
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: "3.12"
      # The oracle scripts are the private kernel repo's (prototypes/oracle).
      - name: Check out the kernel's oracle (quietly, the log is public)
        if: always()
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          SPARSE: prototypes/oracle
        run: .github/scripts/kernel_ci.sh checkout k main
      # Step 29b3: every shown body's STEP file, as the kernel wrote it, read
      # by OpenCascade and judged against the models' hand-worked answers
      # (the kernel repo's prototypes/oracle/golden_step.py); a finding is a failure folder
      # with golden-report.txt, which file_issues.py files like the rest.
      # Then its self-test: one round with a face flipped in every file,
      # which must be caught in every body.
      - name: Golden models' STEP files read by OpenCascade
        if: always()
        env:
          OUT: ${{ runner.temp }}/golden
          PLANTED: ${{ runner.temp }}/golden-planted
        run: |
          [ -f "$OUT/golden-step.jsonl" ] || { echo "no STEP files: the golden run stopped first"; exit 1; }
          pip install -q cadquery-ocp mpmath
          code=0
          # The oracle is private kernel code: its errors (a traceback names its
          # files and lines) go to a file of the runner's, never this public log.
          python3 k/prototypes/oracle/golden_step.py "$OUT/golden-step.jsonl" "$RUNNER_TEMP/golden-step-report.txt" >"$RUNNER_TEMP/golden-step.txt" 2>"$RUNNER_TEMP/oracle-errors.txt" || code=$?
          head -1 "$RUNNER_TEMP/golden-step.txt" | tee -a "$OUT/report.txt"
          if [ -f "$RUNNER_TEMP/golden-step-report.txt" ]; then
            dir="$OUT/seed-golden-step-${{ github.run_id }}"
            mkdir -p "$dir"
            mv "$RUNNER_TEMP/golden-step-report.txt" "$dir/golden-report.txt"
          fi
          FISSION_STEP_FAULT=1 FISSION_SEED=1 FISSION_GOLDEN_ROUNDS=1 FISSION_GOLDEN_TIMING_RUNS=1 FISSION_GOLDEN_OUT="$PLANTED" \
            npm run golden -w @fission/testing >/dev/null || code=$?
          python3 k/prototypes/oracle/golden_step.py "$PLANTED/golden-step.jsonl" --planted >"$RUNNER_TEMP/golden-planted.txt" 2>>"$RUNNER_TEMP/oracle-errors.txt" || code=$?
          tail -1 "$RUNNER_TEMP/golden-planted.txt"
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: golden
          path: ${{ runner.temp }}/golden/
          if-no-files-found: ignore

  # TypeScript mutation testing (packages/testing/stryker/run.sh), one job
  # per target (the list must match run.sh's, as collect-results.sh's does;
  # packages/testing/test/stryker-config.test.ts checks): red on a survivor
  # no test kills and explained.json doesn't explain, or an explanation for
  # one that no longer survives; the lines go into summary.txt either way.
  # Every night; a run by hand only when asked, and then three targets at a
  # time, leaving runners for CI.
  ts-mutants:
    needs: gate
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.ts_mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'schedule' && 7 || 3 }}
      matrix:
        target: [core, design, storage, model, svg, viewport, ai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Mutation testing, ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ runner.temp }}/ts-mutants
        run: |
          mkdir -p "$OUT"
          set -o pipefail
          packages/testing/stryker/run.sh "$TARGET" 2>&1 | tee "$OUT/$TARGET.log" | grep -E '^(UNEXPLAINED|explained\.json lists|[a-z]+: [0-9]+ survivors|[0-9]+ problem)' | tee "$OUT/$TARGET.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ts-mutants-${{ matrix.target }}
          path: ${{ runner.temp }}/ts-mutants/
          if-no-files-found: ignore

  collect:
    needs: [gate, journeys, golden, monkey, ts-mutants]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/incoming
      - name: Add this run to the test-results branch
        env:
          IN: ${{ runner.temp }}/incoming
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The code every round of this run tested, so old failures can be
          # told apart from current ones.
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # Copied out first: the script switches this checkout to test-results.
        run: |
          cp .github/scripts/collect-results.sh .github/scripts/file_issues.py "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/collect-results.sh"
