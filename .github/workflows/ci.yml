name: CI

on:
  # Branches are tested by their pull request's run: a push run of the same
  # commit would repeat kernel, app, e2e, baseline and both browsers and hold nine
  # of the account's 20 runners for nothing.
  push:
    branches: [main]
  pull_request:
  # Once a day on main (6:45am Perth, after the night's random testing): the
  # whole suite on main itself, and the build caches every pull request's run
  # starts from (a cache saved on main is visible to every branch).
  schedule:
    - cron: "45 22 * * *"
  # Each merge queue group, tested in full on the exact commit that lands on
  # main (.github/scripts/ci_mode.py); main's ruleset counts these checks.
  merge_group:
  # By hand only: main's ruleset doesn't count a dispatched run's checks
  # for merging, so auto-merge.yml never starts one.
  workflow_dispatch:

# A newer commit on the same branch cancels the run still testing an older
# one: auto-merge only looks at the head's checks, so the old run's answer
# can't matter, and its runners go to the new run. main's runs always finish.
# The group names the repository the branch lives in, so a fork's pull
# request from a branch called main or claude/x can't cancel our runs, and
# the event, so a run started by hand can't cancel a pull request's own run
# (the only one main's ruleset counts). Tested in
# .github/scripts/test_ci_concurrency.py.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

jobs:
  # Quick or full, and whether Firefox and WebKit run (.github/scripts/ci_mode.py).
  # A pull request's own run is quick only while main requires the merge
  # queue, which then runs the whole suite on the commit that merges. If this
  # job fails, the jobs below run in full (they test `!= 'false'`), never less.
  # docs: every changed file is writing (docs/, changelog.d/, CHANGELOG.md,
  # README.md, VERSION, any CLAUDE.md; a merge queue group's files against main's): the
  # kernel job runs only the CI scripts' tests, the rest skip. A skipped job
  # counts as passed for main's ruleset (and automerge.py's PASSING); they
  # skip only on an explicit 'true'.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      ui: ${{ steps.mode.outputs.ui }}
      docs: ${{ steps.mode.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 .github/scripts/ci_mode.py

  # Required (main's ruleset and automerge.py name it). The kernel's own
  # checks moved with it to its private repo (2026-10-27; they run here as
  # kernel-ci.yml); this job keeps the CI scripts' tests (CHANGELOG.md and
  # changelog.d/ among them), a pull request's changelog entry, and that the
  # committed kernel build is the released one (check_kernel_build.py).
  kernel:
    needs: mode
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Two commits: a pull request's run tests GitHub's merge of it into
      # main, whose first parent is main, for the changelog entry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request adds one entry file in changelog.d/ (or only folds
      # them into CHANGELOG.md), never changes a merged one and never writes
      # a version heading: numbers are given by merge order (changelog.py).
      - name: The pull request's changelog entry
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/changelog.py pr HEAD^1 HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s .github/scripts
      - name: The committed kernel build is the released one
        run: python3 .github/scripts/check_kernel_build.py

  # Required (main's ruleset and automerge.py name it). Mutation testing of
  # the kernel's changed lines moved with the kernel to its private repo
  # (kernel-ci.yml, status kernel-ci/mutants); nothing here has Rust in it.
  mutants-in-diff:
    needs: mode
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The kernel's mutation testing runs in its own repository (kernel-ci/mutants)." | tee -a "$GITHUB_STEP_SUMMARY"

  # Speed and memory against tests/baseline.json (.github/scripts/baseline.py):
  # the app's heap, memory and counts fail past their margin; time only
  # warns. The table is in the job summary. (The kernel's instructions, heap
  # and allocations, and its coverage report, moved to the kernel repo's own
  # checks, 2026-10-27.)
  baseline:
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: python3 .github/scripts/baseline.py --save "$RUNNER_TEMP/measured.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: baseline-measured
          path: ${{ runner.temp }}/measured.json
          if-no-files-found: ignore

  app:
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        working-directory: apps/fission
      - run: npm run typecheck
      - run: npm run journeys

  # The Chromium browser checks (`npm run e2e`), split by e2e/shard.mjs into
  # shares that run side by side: one after another they took 15 minutes,
  # most of the wait for a merge. Every check runs in exactly one share
  # (e2e/shard.test.mjs, part of npm test above).
  e2e-shard:
    name: e2e (${{ matrix.shard }}/3)
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.full != 'false' && needs.mode.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (chromium)
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh chromium
      - run: node e2e/shard.mjs ${{ matrix.shard }} 3
        working-directory: apps/fission
      # A golden image that no longer matches leaves the actual image and a diff (red where different).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots-chromium-${{ matrix.shard }}
          path: apps/fission/e2e/screenshots/*.*.png
          if-no-files-found: ignore

  # A quick pull request run's browser check: the whole-app smoke test in
  # Chromium (about a minute). The merge queue runs every share above before
  # merging. automerge.py never merges a head that only had this one.
  e2e-quick:
    name: e2e (quick)
    needs: mode
    if: needs.mode.outputs.full == 'false' && needs.mode.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (chromium)
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh chromium
      - run: node e2e/smoke.mjs
        working-directory: apps/fission
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots-chromium-quick
          path: apps/fission/e2e/screenshots/*.*.png
          if-no-files-found: ignore

  # The one e2e check auto-merge and main's ruleset wait for (REQUIRED_CHECKS
  # in .github/scripts/automerge.py). Full: green only when every share
  # passed. Quick: green when the smoke test passed. A failed, cancelled or
  # skipped job it needs, or a failed mode job, fails it. Docs only: green.
  e2e:
    needs: [mode, e2e-shard, e2e-quick]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FULL: ${{ needs.mode.outputs.full }}
          SHARDS: ${{ needs.e2e-shard.result }}
          QUICK: ${{ needs.e2e-quick.result }}
          DOCS: ${{ needs.mode.outputs.docs }}
        run: |
          if [ "$DOCS" = true ]; then
            echo "docs only: no browser check needed"
          elif [ "$FULL" = false ]; then
            test "$QUICK" = success || { echo "the quick e2e check did not pass ($QUICK)"; exit 1; }
          else
            test "$SHARDS" = success || { echo "an e2e share did not pass ($SHARDS)"; exit 1; }
          fi

  # A phone's conditions in Safari's engine (owner's decision, 2026-10-28,
  # after the kernel ran out of memory on Ben's iPhone): WebKit at an
  # iPhone's screen with the kernel's memory capped, run out and restarted
  # (e2e/kernel-restart.mjs). Unlike browsers' reports it gates the merge
  # once it has run (automerge.py, GATES_WHEN_RUN); on the same pull
  # requests as browsers, so never in the merge queue.
  phone:
    name: phone
    needs: mode
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.mode.outputs.ui != 'false' && needs.mode.outputs.docs != 'true' }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (webkit)
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh webkit
      - run: node e2e/kernel-restart.mjs
        working-directory: apps/fission
        env:
          E2E_BROWSER: webkit
      # The kernel's files lost to a deploy or the network, on a phone (e2e/app-updated.mjs, blind spots B2).
      - run: node e2e/app-updated.mjs
        working-directory: apps/fission
        env:
          E2E_BROWSER: webkit

  # The sketch browser tests (and, reported only, the smoke test) in the other two engines
  # people use: Firefox and WebKit (Safari's engine). Pixel probes run in
  # all three; golden images are Chromium's only (testing catch-up TC4).
  # Reported, not required: on pull requests that change app files (ci_mode.py,
  # `ui`), and on main's daily run; not in the merge queue, which only
  # waits for the required checks.
  browsers:
    name: browsers (${{ matrix.browser }})
    needs: mode
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.mode.outputs.ui != 'false' && needs.mode.outputs.docs != 'true' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # Retries and time limits for apt's stalls: see the script.
      - name: Install the browser (${{ matrix.browser }})
        working-directory: apps/fission
        timeout-minutes: 27
        run: ../../.github/scripts/install-browser.sh ${{ matrix.browser }}
      # Firefox finds no GL driver headless on CI: it runs with a window on a
      # virtual screen, drawing with Mesa's software GL (e2e/browser.mjs).
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 && echo "E2E_HEADED=1" >> "$GITHUB_ENV" && echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV" && echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - run: $RUN npm run e2e:engines
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      # The whole-app smoke test in this engine, reported but not yet required:
      # its first run here found engine differences (docs/progress/cad.md, TC4)
      # that are other workstreams' to fix; this step goes required once they are.
      - run: $RUN node e2e/smoke.mjs
        if: always()
        continue-on-error: true
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
