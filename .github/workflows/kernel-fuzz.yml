name: Kernel fuzzing

# The private kernel's fuzzing (Panosolid/kernel), on this public repo's free
# runners like its CI (kernel-ci.yml; Ben's decision, 2026-10-27): the STL
# reader against a model of the format and coverage-guided fuzzing of the
# kernel's entry points (cargo-fuzz on nightly Rust, one job per target),
# every body their corpus builds then compared with exact values and
# OpenCascade (with a planted flipped face that must be caught in every body).
#
# Nightly at 23:10 UTC, after the kernel's random testing
# (kernel-nightly.yml, collected by about 22:50); "Run workflow" tests one
# kernel branch (`ref`) for `minutes`.
#
# This log is public: every kernel command runs through kernel_ci.sh run (one
# RESULT line, the output in a log), nothing is cached and nothing is
# uploaded as an artifact. Each job pushes its results and logs to the
# private kernel-results repo (runs/<run>-<attempt>/<job>/); the collect job
# adds them to kernel-results' test-results branch with this repo's
# collect-fuzz.sh (fuzz/log.csv, fuzz/summary.txt, fuzz/failures/) and files
# one issue per kind of problem there (file_issues.py).
run-name: ${{ github.event_name == 'schedule' && 'Kernel fuzzing, nightly' || format('Kernel fuzzing on {0}', inputs.ref) }}

on:
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Kernel branch to fuzz"
        default: "main"
      minutes:
        description: "Minutes of fuzzing per reader or target"
        default: "45"

permissions: {}

concurrency:
  group: kernel-fuzzing-${{ github.event_name == 'schedule' && 'nightly' || inputs.ref }}
  cancel-in-progress: false

env:
  REF: ${{ github.event_name == 'schedule' && 'main' || inputs.ref }}
  MINUTES: ${{ inputs.minutes || '45' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          [[ $REF =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo "bad branch name"; exit 1; }
          sha=$(git ls-remote "https://x-access-token:$KERNEL_READ@github.com/Panosolid/kernel.git" "refs/heads/$REF" 2>/dev/null | cut -f1)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "no kernel branch $REF"; exit 1; }
          echo "Fuzzing kernel $REF at $sha for $MINUTES minutes a job"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  stl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ needs.plan.outputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A debug build (the tests' own profile), so overflow checks are on.
      # The job fails when a round found something; collect still runs.
      - name: Fuzz the STL reader until the time is up (logs in kernel-results)
        env:
          FISSION_FUZZ_OUT: ${{ runner.temp }}/out
        run: |
          .github/scripts/kernel_ci.sh run fuzz-stl "$FISSION_FUZZ_OUT" bash -c \
            "cd k/kernel && cargo test --test fuzz_stl --no-run && FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) cargo test --test fuzz_stl fuzz_stl_random -- --nocapture"
      - name: Save the results to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: mkdir -p "$RUNNER_TEMP/out" && .github/scripts/kernel_ci.sh save fuzz-stl "$RUNNER_TEMP/out"

  kernel:
    # Coverage-guided fuzzing (libFuzzer via cargo-fuzz) of the kernel's
    # entry points, one job per target, from the committed seeds.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [extrude, sketch, placed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ needs.plan.outputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - run: cargo install cargo-fuzz --locked >/dev/null 2>&1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q cadquery-ocp mpmath >/dev/null 2>&1
      - name: Fuzz until the time is up (logs in kernel-results)
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/kernel_ci.sh run "fuzz-$TARGET" "$RUNNER_TEMP/logs" k/kernel/fuzz/run.sh "$TARGET" $(( MINUTES * 60 )) "$RUNNER_TEMP/out"
      # Every body the corpus builds (the seeds, the saved crashes and
      # tonight's finds) and 20,000 random inputs (seeded by the run: replay
      # with the same FISSION_SEED and FISSION_ORACLE_RANDOM), rebuilt in
      # OpenCascade and checked against exact volume, area and crossings; a
      # disagreement is a failure folder with oracle-disagreements.txt.
      - name: Compare the fuzzed bodies with exact values and OpenCascade
        if: always()
        env:
          FISSION_ORACLE_TARGET: ${{ matrix.target }}
          FISSION_ORACLE_CORPUS: fuzz/corpus
          FISSION_ORACLE_OUT: ${{ runner.temp }}/oracle.jsonl
          FISSION_ORACLE_RANDOM: "20000"
          FISSION_SEED: ${{ github.run_id }}
          TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
        run: |
          .github/scripts/kernel_ci.sh run "oracle-$TARGET" "$RUNNER_TEMP/logs" bash -c \
            'cd k/kernel && cargo test --test fuzz_corpus oracle_cases && python3 ../prototypes/oracle/fuzz_shapes.py "$FISSION_ORACLE_OUT" "$RUNNER_TEMP/disagreements.txt"' && exit 0
          if [ -f "$RUNNER_TEMP/disagreements.txt" ]; then
            dir="$RUNNER_TEMP/out/seed-oracle-$TARGET-$RUN_ID"
            mkdir -p "$dir"
            mv "$RUNNER_TEMP/disagreements.txt" "$dir/oracle-disagreements.txt"
          fi
          exit 1
      # The STEP check's self-test: the saved seeds' bodies with a face
      # flipped in every file, each of which the oracle must report.
      - name: The oracle catches a planted flipped face in every fuzz body's STEP file
        if: always()
        env:
          FISSION_ORACLE_TARGET: ${{ matrix.target }}
          FISSION_ORACLE_OUT: ${{ runner.temp }}/planted.jsonl
          FISSION_STEP_FAULT: "1"
          TARGET: ${{ matrix.target }}
        run: |
          .github/scripts/kernel_ci.sh run "oracle-planted-$TARGET" "$RUNNER_TEMP/logs" bash -c \
            'cd k/kernel && cargo test --test fuzz_corpus oracle_cases && python3 ../prototypes/oracle/fuzz_shapes.py "$FISSION_ORACLE_OUT" "$RUNNER_TEMP/planted.txt" --planted'
      - name: Save the results to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R "$RUNNER_TEMP/logs" "$RUNNER_TEMP/out/logs" 2>/dev/null || true
          .github/scripts/kernel_ci.sh save fuzz-kernel-${{ matrix.target }} "$RUNNER_TEMP/out"

  collect:
    needs: [plan, stl, kernel]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Add this run to kernel-results' test-results branch and file issues there
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          GH_TOKEN: ${{ secrets.RESULTS_WRITE }}
          GH_REPO: Panosolid/kernel-results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ needs.plan.outputs.sha }}
          # Each job's result: a red one with no failure folder (a fuzzer or an
          # oracle run that crashed or ran out of time) files an issue too.
          JOBS: ${{ toJSON(needs) }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export BRANCH=$REF
          r="$RUNNER_TEMP/results"
          git clone -q "https://x-access-token:$RESULTS_WRITE@github.com/Panosolid/kernel-results.git" "$r" 2>/dev/null
          # Copied out first: collect-fuzz.sh switches the clone to test-results.
          export IN="$RUNNER_TEMP/incoming"
          cp -R "$r/runs/$RUN" "$IN" 2>/dev/null || mkdir -p "$IN"
          cp .github/scripts/collect-fuzz.sh .github/scripts/file_issues.py .github/scripts/sim_numbers.py "$RUNNER_TEMP/"
          cd "$r" && GITHUB_STEP_SUMMARY='' "$GITHUB_WORKSPACE/.github/scripts/kernel_ci.sh" run collect "$RUNNER_TEMP/logs" bash "$RUNNER_TEMP/collect-fuzz.sh"
      - name: Save the collect log to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: mkdir -p "$RUNNER_TEMP/logs" && .github/scripts/kernel_ci.sh save collect "$RUNNER_TEMP/logs"
